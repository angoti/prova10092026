<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ficha do Animal | PetVida</title>
	<style>
		:root {
			--verde: #1f7a68;
			--verde-claro: #e8f5f1;
			--texto: #263238;
			--muted: #68757b;
			--borda: #dce7e4;
			--fundo: #f5f9f8;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			background: var(--fundo);
			color: var(--texto);
			font-family: Arial, Helvetica, sans-serif;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 18px 7%;
			background: #fff;
			border-bottom: 1px solid var(--borda);
		}

		.marca { color: var(--verde); font-size: 1.5rem; font-weight: 700; }
		.marca span { color: #f2a65a; }
		.usuario { color: var(--muted); font-size: .9rem; }

		main { max-width: 1080px; margin: 32px auto; padding: 0 20px; }
		.cabecalho-pagina { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
		h1 { margin: 0 0 6px; font-size: 1.8rem; }
		.subtitulo { margin: 0; color: var(--muted); }

		.acoes { display: flex; gap: 10px; }
		button, .botao {
			border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer;
			font-weight: 700; text-decoration: none; font-size: .9rem;
		}
		.primario { background: var(--verde); color: #fff; }
		.secundario { background: #fff; color: var(--verde); border: 1px solid var(--verde); }

		.cartao { background: #fff; border: 1px solid var(--borda); border-radius: 14px; margin-bottom: 20px; overflow: hidden; }
		.perfil { display: flex; align-items: center; gap: 20px; padding: 24px; }
		.avatar {
			display: grid; place-items: center; width: 86px; height: 86px; border-radius: 50%;
			background: var(--verde-claro); font-size: 2.7rem;
		}
		.perfil h2 { margin: 0 0 7px; }
		.status { display: inline-block; padding: 5px 10px; border-radius: 20px; background: #e3f5e9; color: #287a43; font-size: .78rem; font-weight: 700; }

		.titulo-secao { padding: 18px 24px; border-bottom: 1px solid var(--borda); font-size: 1.05rem; font-weight: 700; }
		.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 24px; }
		.campo small { display: block; margin-bottom: 6px; color: var(--muted); font-size: .78rem; }
		.campo strong { font-size: .98rem; }
		.observacoes { padding: 0 24px 24px; line-height: 1.6; color: var(--muted); }

		@media (max-width: 650px) {
			header, .cabecalho-pagina { align-items: flex-start; flex-direction: column; gap: 14px; }
			.acoes { width: 100%; }
			.acoes button { flex: 1; }
			.grade { grid-template-columns: 1fr 1fr; }
		}
	</style>
</head>
<body>
	<header>
		<div class="marca">Pet<span>Vida</span></div>
		<div class="usuario">Área da clínica</div>
	</header>

	<main>
		<div class="cabecalho-pagina">
			<div>
				<h1>Ficha do animal</h1>
				<p class="subtitulo">Dados cadastrais</p>
			</div>
	
		</div>

		<section class="cartao">
			<div class="titulo-secao">Informações do animal</div>
			<div class="grade">
				<div class="campo"><small>Nome</small><strong th:text="${animal.getNome()}">Thor</strong></div>
				<div class="campo"><small>Espécie</small><strong th:text="${animal.getEspecie()}">Cão</strong></div>
				<div class="campo"><small>Idade</small><strong th:text="${animal.getIdade()}">5 anos</strong></div>
				<div class="campo"><small>Nome do tutor</small><strong th:text="${animal.getTutor().getNome()}">Mariana Oliveira</strong></div>
				<div class="campo"><small>Telefone do tutor</small><strong th:text="${animal.getTutor().getTelefone()}"> (11) 99999-0000</strong></div>
				
			</div>
		</section>
	</main>
</body>
</html>
